name: CI

# Vérifications à chaque modification. Construction des installeurs sur un
# tag vX.Y.Z (scripts/release.sh), ou à la main.

on:
  push:
    # `branches` obligatoire : un `push` qui ne liste que `tags` ignore les
    # pushes de branche.
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Tests et types
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - name: Dépendances système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: bun install --frozen-lockfile
      - name: Types (svelte-check)
        run: bun run check
      - name: Interface
        run: bun run build
      # Les tests lisent fixtures/presets.toml, copie de celui du pack.
      - name: Tests du cœur
        working-directory: src-tauri
        run: cargo test --lib

  build:
    name: Installeur ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04, target: "" }
          - { name: Windows, os: windows-latest, target: "" }
          # Construit depuis la machine x64 (outils ARM64 de Visual Studio fournis).
          - { name: Windows (ARM), os: windows-latest, target: aarch64-pc-windows-msvc }
          - { name: macOS (Apple), os: macos-latest, target: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - name: Dépendances système de Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: bun install --frozen-lockfile
      # Logo Turi Craft (hors dépôt, pas sous GPL) : variable TURI_LOGO_URL du
      # dépôt. Absente (fork) : l'icône provisoire reste.
      - name: Logo
        shell: bash
        env:
          TURI_LOGO_URL: ${{ vars.TURI_LOGO_URL }}
        run: scripts/branding.sh
      - uses: tauri-apps/tauri-action@v0
        env:
          # Clé PRIVÉE de mise à jour (tauri signer) : secret GitHub. Sans elle,
          # pas de .sig, et les launchers installés refusent la mise à jour.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: bunx tauri
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: AppImage sans les libwayland d'Ubuntu (fenêtre grise sinon)
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: scripts/fix-appimage.sh src-tauri/target/release/bundle/appimage/*.AppImage
      # Installeurs (première installation) et fichiers de mise à jour signés.
      - name: Rassembler les fichiers
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.AppImage' -o -name '*.AppImage.sig' -o -name '*.deb' \
               -o -name '*-setup.exe' -o -name '*-setup.exe.sig' \
               -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) \
            -exec cp {} out/ \;
          # Les deux Mac produisent le même nom : on y met l'architecture.
          if [[ "${{ matrix.target }}" == *darwin* ]]; then
            arch=$([[ "${{ matrix.target }}" == aarch64* ]] && echo aarch64 || echo x64)
            for f in out/*.app.tar.gz out/*.app.tar.gz.sig; do
              [ -e "$f" ] || continue
              mv "$f" "${f/.app.tar.gz/_${arch}.app.tar.gz}"
            done
          fi
          # Pas d'espace dans les noms : GitHub les change en points, et
          # latest.json pointerait vers des fichiers qui n'existent pas.
          for f in out/*; do mv "$f" "$(dirname "$f")/$(basename "$f" | tr ' ' '-')"; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.name }}
          path: out/*

  # Sur un tag vX.Y.Z : une version GitHub avec tous les fichiers et
  # latest.json. Le serveur du pack la recopie et la sert (plugins.updater
  # dans tauri.conf.json).
  publish:
    name: Publier la version
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # checkout ne rapporte que le commit : sans l'objet du tag annoté, son
      # message (les notes pour les joueurs) serait celui du commit.
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: latest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN/,$d')"
          python3 scripts/latest-json.py out "$version" "${notes:-Launcher $version}" > out/latest.json
          cat out/latest.json
      - name: Version GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Launcher ${GITHUB_REF_NAME#v}" --notes-file <(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
