toggles = { shaders = false, objets_physiques = false, premiere_personne = true }
description = "Animations et lumières, vue à 1 km."
memory_gb = 6         # launchers 0.1.x seulement
groups = ["animations", "joueur", "lumieres", "particules", "textures_connectees", "interface_animee", "aeronautics_visuel", "sons_legers"]
resource_packs = ["file/FreshAnimations_v1.10.4.zip"]

