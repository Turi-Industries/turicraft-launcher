# Préréglages de qualité du client Turi Craft — lus par le launcher.
#
# Décision : docs/decisions/0007-launcher-prereglages-interface.md
#
# Ce fichier est servi avec le pack (Caddy) mais exclu de l'index packwiz
# (.packwizignore) : il n'est pas copié dans l'instance des joueurs, le
# launcher le télécharge à part. Modifier un préréglage = modifier ce fichier,
# sans recompiler le launcher.
#
# Toutes les clés ont été relevées dans les fichiers générés par le jeu ou dans
# les jars (2026-09-24), jamais devinées. Le launcher applique un préréglage
# APRÈS la synchronisation packwiz, à chaque lancement.

schema = 1

# ─── Choix automatique ──────────────────────────────────────────────────────
#
# Le launcher mesure la RAM totale, le nombre de fils du processeur et la
# carte graphique (dédiée ou intégrée, mémoire vidéo). Il retient le premier
# préréglage de `order` dont TOUTES les conditions sont remplies ; à défaut,
# le dernier. Une puce Apple compte comme « integrated » (mémoire partagée).
# Le joueur peut toujours changer ensuite.
#
# Le préréglage suit la CARTE GRAPHIQUE et le PROCESSEUR : peu de RAM ne veut
# pas dire des graphismes moches. La RAM règle la mémoire du jeu ([memory])
# et, dans [[adapt]], ce qui en consomme vraiment (distance de vue lointaine).
#
# `windows_arm = false` : PC Windows à processeur ARM (Snapdragon X) exclu.
# Son processeur tiendrait Moyen, pas sa puce Adreno : pilote OpenGL moins
# rodé, mémoire partagée — ça saccadait en Moyen (Snapdragon X1, 25/09).
# Launchers 0.1.6 et avant : clé ignorée.
[detection]
order = ["haut", "moyen", "faible"]

[detection.haut]
min_cpu_threads = 8
gpu = "dedicated"      # dedicated | any
min_vram_gb = 6
windows_arm = false

[detection.moyen]
min_ram_gb = 6         # en dessous, même la mémoire du jeu manque
min_cpu_threads = 6
gpu = "any"            # cartes intégrées et puces Apple comprises
min_vram_gb = 0
windows_arm = false

[detection.faible]
# toujours accepté

# ─── Mémoire ────────────────────────────────────────────────────────────────
# Selon la RAM de la machine, pas selon la qualité graphique. Le palier le
# plus haut atteint (RAM arrondie : un « 8 Go » en annonce ~7,6).
#   8 Go → 6 Go : il en reste 2 pour le système et ce que Java prend hors du tas.
#   Au-delà de 16 Go, la moitié environ (26/09) : 420 mods, shaders et vue
#   lointaine profitent d'un tas large, et le système garde de quoi vivre.
# Puce Apple ou Snapdragon : la carte graphique prend sur la même mémoire → `shared_gpu_gb`
# de moins (Mac 8 Go → 5,5 Go ; à 5 Go, grosses saccades — 24/09).
# Réglage manuel (mode Avancé) : au plus RAM − `min_free_gb` (− shared_gpu_gb).
[memory]
reserve_system_gb = 3     # launchers 0.1.x seulement
min_free_gb = 2
shared_gpu_gb = 0.5
steps = [
  { ram = 0,  game = 3 },
  { ram = 6,  game = 4 },
  { ram = 8,  game = 6 },
  { ram = 12, game = 8 },
  { ram = 24, game = 12 },
  { ram = 32, game = 16 },
]

# ─── Ramasse-miettes (Java 21 de Mojang, options vérifiées le 24/09) ────────
# ZGC générationnel : pauses quasi nulles, mais il lui faut de la marge. Sur
# un petit tas, il bloque les allocations le temps de nettoyer (« allocation
# stall ») : de grosses saccades. En dessous de 8 Go ou de 8 fils : G1, réglé
# pour un client (pauses courtes, jeune génération large, objets peu vieillis).
[jvm]
zgc_min_memory_gb = 8
zgc_min_cpu_threads = 8
zgc = ["-XX:+UseZGC", "-XX:+ZGenerational"]
g1 = [
  "-XX:+UseG1GC", "-XX:+ParallelRefProcEnabled", "-XX:MaxGCPauseMillis=50",
  "-XX:+UnlockExperimentalVMOptions", "-XX:+DisableExplicitGC",
  "-XX:G1NewSizePercent=30", "-XX:G1MaxNewSizePercent=40", "-XX:G1HeapRegionSize=8M",
  "-XX:G1ReservePercent=20", "-XX:G1MixedGCCountTarget=4",
  "-XX:InitiatingHeapOccupancyPercent=15", "-XX:G1MixedGCLiveThresholdPercent=90",
  "-XX:SurvivorRatio=32", "-XX:MaxTenuringThreshold=1", "-XX:+PerfDisableSharedMem",
]

# ─── Mods optionnels ────────────────────────────────────────────────────────
# Chemins des métadonnées packwiz marquées `[option] optional = true`.
# Groupes cochés ensemble dans l'écran Personnalisé.
[optional_groups]
animations = [
  "mods/entity-model-features.pw.toml",
  "mods/entitytexturefeatures.pw.toml",
  "resourcepacks/fresh-animations.pw.toml",
]
joueur = [
  "mods/3dskinlayers.pw.toml",
  "mods/wavey-capes.pw.toml",
  "mods/not-enough-animations.pw.toml",
]
premiere_personne = ["mods/first-person-model.pw.toml"]
# Contraption Lights éclaire les engins Create PAR LambDynamicLights : sans
# lui, il affiche en jeu « Lighting mode LAMB, which is not installed ».
lumieres = ["mods/lambdynamiclights.pw.toml", "mods/contraption-lights.pw.toml"]
particules = [
  "mods/particular-reforged.pw.toml",
  "mods/make_bubbles_pop.pw.toml",
]
objets_physiques = ["mods/itemphysic-lite.pw.toml"]
textures_connectees = ["mods/athena-ctm.pw.toml"]
interface_animee = ["mods/chatanimation.pw.toml"]
aeronautics_visuel = ["mods/aeronautics-propeller-blur.pw.toml"]
sons_legers = [
  "mods/pf-neoforge.pw.toml",
  "mods/dripsounds.pw.toml",
  "mods/aeronautics-wind-sound.pw.toml",
  "mods/create-rolling-tones.pw.toml",
]
sons_ambiance = ["mods/ambientsounds.pw.toml"]

# ─── Mods optionnels, tels que le joueur les voit ───────────────────────────
# Chaque groupe devient un interrupteur de la section « Mods » (sauf ceux
# qu'une option du jeu pilote déjà : objets_physiques, premiere_personne).
[group_info.animations]
label = "Animations des créatures"
description = "Fresh Animations : les mobs clignent des yeux, respirent, bougent la tête."
[group_info.joueur]
label = "Skins 3D, capes, animations"
description = "Couches de skin en relief, capes qui flottent, bras qui suivent les mouvements."
[group_info.lumieres]
label = "Lumières dynamiques"
description = "Une torche en main éclaire autour de toi, les lampes des engins aussi."
[group_info.particules]
label = "Particules supplémentaires"
description = "Feuilles qui tombent, bulles qui éclatent, lucioles."
[group_info.textures_connectees]
label = "Textures connectées"
description = "Le verre et les bibliothèques se raccordent entre blocs voisins."
[group_info.interface_animee]
label = "Chat animé"
description = "Les messages du chat glissent à l'écran."
[group_info.aeronautics_visuel]
label = "Flou des hélices"
description = "Les hélices d'Aeronautics se floutent en tournant vite."
[group_info.sons_legers]
label = "Bruits de pas et de gouttes"
description = "Pas selon le sol, gouttes qui tombent, sons des engins Create."
[group_info.sons_ambiance]
label = "Ambiance sonore complète"
description = "AmbientSounds : vent, oiseaux, grottes, selon le biome. Plus gourmand."

# ─── Options du jeu ─────────────────────────────────────────────────────────
# Interrupteurs du mode Simple : ce qui change le jeu et qu'un joueur peut
# vouloir couper. Valeur : choix du joueur, sinon `toggles` du préréglage,
# sinon `default`. Appliqués APRÈS le préréglage : ils ont le dernier mot sur
# les fichiers qu'ils touchent. `groups` : groupes de mods optionnels ajoutés
# (activé) ou retirés (désactivé) de ceux du préréglage.

[toggles.shaders]
category = "graphismes"
label = "Shaders"
description = "Ombres, reflets, eau réaliste. Demande une bonne carte graphique."
default = true
[toggles.shaders.files."config/iris.properties"]
format = "properties"
set = { enableShaders = "true" }
[toggles.shaders.off.files."config/iris.properties"]
format = "properties"
set = { enableShaders = "false" }

# Quel pack de shaders : `[choices]` (launcher 0.2.0+). Écrit APRÈS les
# interrupteurs. « Autre » n'écrit rien : un pack ajouté par le joueur dans
# shaderpacks/ et choisi en jeu est repris par le launcher, qui n'y touche
# plus, même quand ce fichier ou le pack changent.
[choices.shader_pack]
category = "graphismes"
label = "Pack de shaders"
description = "Quel pack de shaders utiliser."
default = "unbound"
requires = "shaders"

[[choices.shader_pack.values]]
id = "unbound"
label = "Unbound"
description = "Complementary Unbound : lumière, ciel et eau plus travaillés."
files."config/iris.properties" = { format = "properties", set = { shaderPack = "ComplementaryUnbound_r5.9.3 + EuphoriaPatches_1.10.5" } }

[[choices.shader_pack.values]]
id = "reimagined"
label = "Reimagined"
description = "Complementary Reimagined : plus proche de Minecraft d'origine."
files."config/iris.properties" = { format = "properties", set = { shaderPack = "ComplementaryReimagined_r5.9.3 + EuphoriaPatches_1.10.5" } }

[[choices.shader_pack.values]]
id = "autre"
label = "Autre"
description = "Un pack ajouté dans le dossier shaderpacks et choisi en jeu (Options vidéo, Shaders) : le launcher n’y touche pas."
other = true

[toggles.vue_lointaine]
category = "graphismes"
label = "Vue lointaine"
description = "Distant Horizons : le paysage reste visible bien au-delà de la distance d'affichage."
default = true
# La VRAIE option : `client.quickEnableRendering` n'est qu'un raccourci de
# l'écran de réglages de DH 3.x, jamais relu dans le fichier — l'écrire ne
# coupait rien (DH restait actif partout, Faible et Mac compris).
[toggles.vue_lointaine.files."config/DistantHorizons.toml"]
format = "toml"
set = { "client.advanced.debugging.rendererMode" = "DEFAULT" }
[toggles.vue_lointaine.off.files."config/DistantHorizons.toml"]
format = "toml"
set = { "client.advanced.debugging.rendererMode" = "DISABLED" }

[toggles.son_3d]
category = "mods"
label = "Son 3D réaliste"
description = "Écho dans les grottes, sons étouffés derrière les murs."
default = true
[toggles.son_3d.files."config/sound_physics_remastered/soundphysics.properties"]
format = "properties"
set = { enabled = "true" }
[toggles.son_3d.off.files."config/sound_physics_remastered/soundphysics.properties"]
format = "properties"
set = { enabled = "false" }

[toggles.objets_physiques]
category = "mods"
label = "Objets au sol réalistes"
description = "Les objets tombent à plat au lieu de flotter en tournant."
default = true
groups = ["objets_physiques"]

[toggles.premiere_personne]
category = "mods"
label = "Corps en première personne"
description = "Voir ses jambes et son corps en regardant vers le bas."
default = false
groups = ["premiere_personne"]

[toggles.synchro_verticale]
category = "graphismes"
label = "Synchronisation verticale"
description = "Évite les déchirures de l'image. La couper peut donner plus d'images par seconde."
default = true
options = { enableVsync = "true" }
[toggles.synchro_verticale.off]
options = { enableVsync = "false" }

[toggles.plein_ecran]
category = "graphismes"
label = "Plein écran"
description = "Le jeu charge dans une fenêtre, puis passe en plein écran. F11 en jeu pour basculer : la partie suivante reprend la fenêtre comme tu l'as laissée."
default = true
options = { fullscreen = "true" }
[toggles.plein_ecran.off]
options = { fullscreen = "false" }

[toggles.infobulle]
category = "interface"
label = "Infobulle de ce que tu regardes"
description = "Jade : nom du bloc ou de la créature visée, en haut de l'écran."
default = true
[toggles.infobulle.files."config/jade/jade.json"]
format = "json"
set = { "general.displayTooltip" = true }
[toggles.infobulle.off.files."config/jade/jade.json"]
format = "json"
set = { "general.displayTooltip" = false }

[toggles.titres_biomes]
category = "interface"
label = "Titres des biomes"
description = "Le nom du biome s'affiche quand tu y entres."
default = true
[toggles.titres_biomes.files."config/travelerstitles-neoforge-1_21.toml"]
format = "toml"
set = { "Traveler's Titles.Biome Titles.Enable Biome Titles" = true }
[toggles.titres_biomes.off.files."config/travelerstitles-neoforge-1_21.toml"]
format = "toml"
set = { "Traveler's Titles.Biome Titles.Enable Biome Titles" = false }

[toggles.balancement]
category = "graphismes"
label = "Balancement de la vue"
description = "La caméra bouge en marchant. À couper si ça donne mal au cœur."
default = true
options = { bobView = "true" }
[toggles.balancement.off]
options = { bobView = "false" }

# ─── Curseurs ───────────────────────────────────────────────────────────────
# Réglages chiffrés du mode Simple. Valeur : choix du joueur, sinon celle que
# le préréglage écrit (`option` dans options.txt, ou `file` + `key`), bornée
# par min/max. `requires` : grisé si cette option du jeu est coupée.

[sliders.distance]
label = "Distance d'affichage"
description = "Chunks chargés autour de toi. Le plus gros levier de performance."
option = "renderDistance"
min = 2
max = 32
step = 1
unit = "chunks"

[sliders.distance_lointaine]
label = "Distance de la vue lointaine"
description = "Jusqu'où Distant Horizons dessine le paysage."
file = "config/DistantHorizons.toml"
format = "toml"
key = "client.advanced.graphics.quality.lodChunkRenderDistanceRadius"
min = 32
max = 256
step = 16
unit = "chunks"
requires = "vue_lointaine"

[sliders.interface]
label = "Taille de l'interface"
description = "Menus, inventaire, barre de vie. Réglée sur la définition de ton écran."
option = "guiScale"
min = 1
max = 6
step = 1
unit = "gui"
default = 3

[sliders.images]
label = "Images par seconde maximum"
description = "Réglé sur la fréquence de ton écran : au-delà, les images ne s'affichent pas. 260 = illimité."
option = "maxFps"
min = 30
max = 260
step = 10
unit = "fps"
# Aucun préréglage ne limite les images/s : par défaut, la fréquence de
# l'écran principal (règle plus bas) ; inconnue, illimité — la synchro
# verticale limite déjà à ce que l'écran affiche.
default = 260

# ─── Une fois par installation ──────────────────────────────────────────────
# Posé au premier lancement par le launcher, puis plus jamais : si le joueur
# change de langue en jeu, c'est son choix. Monter `version` le repose une
# fois chez tout le monde.
[once]
version = 2         # options.txt : la monter les repose UNE fois chez tout le monde
# Paquets de ressources (version 2, 25/09), du moins au plus prioritaire :
# - E19 Cobblemon Minimap Icons : icônes Pokémon de la minimap Xaero, SOUS
#   mod_resources — E19 réécrit 139 resolvers de Cobblemon avec leur version
#   1.7 (sans les yeux des Alpha…) ; en dessous, Cobblemon 1.8 garde la main
#   sur ces fichiers et E19 n'apporte que ses icônes ;
# - RCT Trainers+, puis RCT BDSP par-dessus (il remplace 51 de ses dresseurs).
#   BDSP se déclare au format 48 (Minecraft plus récent) : textures seules,
#   elles marchent ; sans incompatibleResourcePacks, le jeu le retirerait.
# Le launcher garde ensuite ces paquets à leur place et ajoute les siens
# (Fresh Animations) au-dessus.
options = { lang = "fr_fr", resourcePacks = '["vanilla","file/E19 Cobblemon Minimap Icons.zip","fabric","mod_resources","aeronauticshotairfix:hot_air_fix","file/RCT Trainers+ [1.6] v2.1.zip","file/RCT Brilliant Diamond & Shining Pearl Skins.zip"]', incompatibleResourcePacks = '["file/RCT Brilliant Diamond & Shining Pearl Skins.zip"]' }
files_version = 1   # fichiers ci-dessous, suivis à part (launcher 0.1.4 et plus)
# Pas d'accueil « Appuie sur V pour configurer » de Simple Voice Chat : V
# marche toujours. Fichier propre à chaque joueur (micro, volumes) : posé ici,
# jamais embarqué dans le pack.
[once.files."config/voicechat/voicechat-client.properties"]
format = "properties"
set = { onboarding_finished = "true" }
# Pas de ligne « ==== Restored Messages ==== » (Chat Tools). Le fichier vient
# de defaultoptions au premier démarrage, déjà à false : ici, seulement pour
# les installations existantes.
[once.files."config/chat_tools.json"]
format = "json"
if_exists = true
set = { "general.RestoreMessages.SplitLineEnabled" = false }

# ─── Ajustements automatiques ───────────────────────────────────────────────
# Appliqués dans l'ordre, par-dessus le préréglage, quand la machine remplit
# `when` (et, si `presets` est donné, pour ces préréglages seulement). Ce sont
# des valeurs conseillées : le choix du joueur passe toujours par-dessus.
# Conditions : min/max_ram_gb, min/max_cpu_threads, min/max_vram_gb,
# gpu = "dedicated" | "integrated", windows_arm = true | false.

# Ce qui AUGMENTE d'abord, ce qui limite ensuite : la dernière règle a le
# dernier mot. « grosse carte graphique » placée après les règles de
# mémoire donnait 16 / 192 à un PC de 8 Go avec une carte de 12 Go (25/09).
[[adapt]]
note = "grosse carte graphique"
presets = ["haut"]
when = { min_vram_gb = 12 }
sliders = { distance = 16, distance_lointaine = 192 }
# Shaders en profil HIGH : ombres à 192 blocs, reflets des blocs, ombres des
# créatures (profile.HIGH de Complementary)
files."shaderpacks/ComplementaryUnbound_r5.9.3 + EuphoriaPatches_1.10.5.txt" = { format = "properties", set = { SHADOW_QUALITY = "2", shadowDistance = "192.0", WATER_REFLECT_QUALITY = "2", BLOCK_REFLECT_QUALITY = "3", LIGHTSHAFT_QUALI_DEFINE = "2", SSAO_QUALI_DEFINE = "2", FXAA_DEFINE = "1", DETAIL_QUALITY = "2", CLOUD_QUALITY = "2", ANISOTROPIC_FILTER = "0", COLORED_LIGHTING = "0", WORLD_SPACE_REFLECTIONS = "-1", ENTITY_SHADOW = "1", RAIN_PUDDLES = "0" } }
files."shaderpacks/ComplementaryReimagined_r5.9.3 + EuphoriaPatches_1.10.5.txt" = { format = "properties", set = { SHADOW_QUALITY = "2", shadowDistance = "192.0", WATER_REFLECT_QUALITY = "2", BLOCK_REFLECT_QUALITY = "3", LIGHTSHAFT_QUALI_DEFINE = "2", SSAO_QUALI_DEFINE = "2", FXAA_DEFINE = "1", DETAIL_QUALITY = "2", CLOUD_QUALITY = "2", ANISOTROPIC_FILTER = "0", COLORED_LIGHTING = "0", WORLD_SPACE_REFLECTIONS = "-1", ENTITY_SHADOW = "1", RAIN_PUDDLES = "0" } }
files."config/iris.properties" = { format = "properties", set = { maxShadowRenderDistance = "12" } }

[[adapt]]
note = "carte graphique intégrée"
when = { gpu = "integrated" }
toggles = { shaders = false, vue_lointaine = false }

[[adapt]]
note = "processeur à 4 cœurs ou moins"
when = { max_cpu_threads = 4 }
toggles = { son_3d = false }   # Sound Physics lance des rayons à chaque son

[[adapt]]
note = "moins de 12 Go de mémoire"
when = { max_ram_gb = 12 }
sliders = { distance_lointaine = 64 }   # Distant Horizons garde ses LOD en mémoire

[[adapt]]
note = "8 Go de mémoire"
presets = ["haut"]
when = { max_ram_gb = 9 }
sliders = { distance = 10 }   # les chunks chargés tiennent dans la mémoire du jeu ; l'image reste Haut

# Snapdragon : aussi quand le joueur choisit Moyen ou Haut lui-même — ce qui
# coûte le plus à la puce Adreno reste coupé par défaut (il peut le rallumer).
[[adapt]]
note = "PC Snapdragon (Windows ARM)"
when = { windows_arm = true }
toggles = { shaders = false, vue_lointaine = false, son_3d = false, objets_physiques = false }
sliders = { distance = 8 }

[[adapt]]
note = "processeur à 16 fils ou plus"
presets = ["moyen", "haut"]
when = { min_cpu_threads = 16 }
files."config/DistantHorizons.toml" = { format = "toml", set = { "common.multiThreading.numberOfThreads" = 4 } }

# Écran PRINCIPAL (pas le plus rapide : sur un second écran à 165 Hz, le jeu
# tourne quand même sur le principal). Fréquence et VRR : launcher,
# display.rs. « ecran » = sa fréquence, « ecran-3 » = 3 de moins, pour rester
# dans la plage du VRR. macOS : jamais de VRR, sa synchro est imposée.

[[adapt]]
note = "définition de ton écran principal"
when = { height_known = true }
sliders = { interface = "interface" }   # hauteur / 480 : 2 en 1080p, 3 en 1440p, 5 en 4K

[[adapt]]
note = "fréquence de ton écran principal"
when = { refresh_known = true }
sliders = { images = "ecran" }

[[adapt]]
note = "écran FreeSync / G-Sync actif"
when = { vrr = true }
toggles = { synchro_verticale = false }   # le VRR supprime les déchirures sans elle
sliders = { images = "ecran-3" }

# ════════════════════════════════════════════════════════════════════════════
[presets.faible]
label = "Faible"
toggles = { shaders = false, vue_lointaine = false, son_3d = false, objets_physiques = false, synchro_verticale = false }
description = "Processeur modeste ou PC Snapdragon : l'essentiel, sans sacrifier l'image."
memory_gb = 5         # launchers 0.1.x seulement : la mémoire suit la machine ([memory])
# Bon marché, et ce qui se voit le plus : textures connectées, chat animé.
groups = ["textures_connectees", "interface_animee"]
resource_packs = []   # Fresh Animations retiré : EMF est désactivé

[presets.faible.options]   # options.txt, valeurs telles que Minecraft les écrit
# Faible sert aux PROCESSEURS modestes (moins de 6 fils) et aux PC Snapdragon :
# on économise ce qui leur coûte (distance, particules, nuages), pas l'image.
renderDistance = "8"
simulationDistance = "5"   # solo seulement ; le serveur impose la sienne
graphicsMode = "0"         # 0 rapides, 1 détaillés
particles = "1"            # 0 toutes, 1 réduites, 2 minimales
mipmapLevels = "2"
biomeBlendRadius = "1"
renderClouds = '"fast"'
entityShadows = "true"
entityDistanceScaling = "0.75"
ao = "true"                # éclairage adouci : Sodium le rend peu coûteux
menuBackgroundBlurriness = "0"

[presets.faible.files."config/sodium-options.json"]
format = "json"
set = { "quality.weather_quality" = "FAST", "quality.leaves_quality" = "FAST", "quality.enable_vignette" = false, "performance.animate_only_visible_textures" = true, "performance.use_entity_culling" = true, "performance.use_fog_occlusion" = true, "performance.use_block_face_culling" = true, "performance.chunk_build_defer_mode" = "ALWAYS" }

[presets.faible.files."config/sodium-extra-options.json"]
format = "json"
